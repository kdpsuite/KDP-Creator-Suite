<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>KDP Creator Suite — Status</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --ok: #3dba7a;
      --bad: #e35d5d;
      --warn: #d4a017;
      --line: #2a3542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1c3a4f 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #24301f 0%, transparent 50%),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 1.75rem;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .sub { color: var(--muted); margin: 0 0 28px; font-size: 0.95rem; }
    .overall {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--bad); }
    .dot.warn { background: var(--warn); }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    li {
      display: grid;
      grid-template-columns: 12px 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 0.92rem;
    }
    li:last-child { border-bottom: 0; }
    .name { font-weight: 500; }
    .code, .ms { color: var(--muted); font-variant-numeric: tabular-nums; }
    .foot {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    a { color: #7eb8e8; }
    button {
      margin-top: 16px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
    }
    button:hover { border-color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>KDP Creator Suite</h1>
    <p class="sub">Public system status · probes production API health endpoints</p>
    <div class="overall" id="overall">
      <span class="dot" id="overall-dot"></span>
      <div>
        <div id="overall-label">Checking…</div>
        <div class="sub" style="margin:4px 0 0" id="checked-at"></div>
      </div>
    </div>
    <ul id="checks"></ul>
    <button type="button" id="refresh">Refresh</button>
    <p class="foot">
      Issues with your account or a conversion?
      Email <a href="mailto:support@kdpsuite.com?subject=KDP%20Creator%20Suite%20support">support@kdpsuite.com</a>
      (typical reply 1–2 business days). This page is not a full incident desk.
    </p>
  </main>
  <script src="/status.js"></script>
</body>
</html>
